[project]
name = "nextlearn-backend"
version = "2.0.0"
description = "FastAPI backend for NextLearn: AI grading of handwritten math answers"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "cloudinary>=1.44.1",
    "email-validator>=2.3.0",
    "fastapi>=0.135.1",
    "google-genai>=1.66.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.12.5",
    "pyjwt>=2.15.1",
    "pypdf>=5",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.48",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
