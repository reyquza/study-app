<div class="day-block">
    <h4>{{ _("問題") }}</h4>
    
    {% if problem.problem_image_path %}
        {% if problem.problem_image_path.endswith('.pdf') %}
            <iframe 
                src="{{ problem.problem_image_path }}" 
                style="width: 100%; height: 500px; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 0 auto;">
            </iframe>
        {% else %}
            <img 
                src="{{ problem.problem_image_path }}" 
                alt="{{ _('問題画像') }}"
                style="max-width: 100%; max-height: 420px; border-radius: 8px; display: block; margin: 0 auto; border: 1px solid var(--line);">
        {% endif %}
    {% endif %}
    
    {% if problem.problem_text %}
        <div class="problem-box"{% if problem.problem_image_path %} style="margin-top: 12px;"{% endif %}>{{ problem.problem_text | trim }}</div>
    {% endif %}
</div>
