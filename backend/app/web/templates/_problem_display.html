<div class="day-block" style="margin-bottom: 20px;">
    <h4 style="margin-top: 0; color: #4CAF50;">{{ _("問題") }}</h4>
    
    {% if problem.problem_image_path %}
        {% if problem.problem_image_path.endswith('.pdf') %}
            <iframe 
                src="{{ problem.problem_image_path }}" 
                style="width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 4px; display: block; margin: 0 auto;">
            </iframe>
        {% else %}
            <img 
                src="{{ problem.problem_image_path }}" 
                alt="{{ _('問題画像') }}"
                style="max-width: 100%; max-height: 400px; border-radius: 4px; display: block; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        {% endif %}
    {% endif %}
    
    {% if problem.problem_text %}
        <div class="problem-box" style="background-color: #f9f9f9; padding: 15px; border-left: 4px solid #ccc;">
            {{ problem.problem_text }}
        </div>
    {% endif %}
</div>
