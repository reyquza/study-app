# Render Blueprint for the always-on web service (pages, API and the in-process grading
# worker). The database is Supabase Postgres, passed in as DATABASE_URL.
services:
  - type: web
    name: nextlearn
    runtime: docker
    # Render resolves the Docker paths against rootDir, so they point inside backend/.
    # rootDir also limits auto-deploys to commits that change backend/.
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    # Deploy a commit on main only after CI has passed on it.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Tokyo
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
