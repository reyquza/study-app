<div class="day-block" style="margin-bottom: 20px;">
    <h4 style="margin-top: 0; color: #4CAF50;">問題</h4>
    
    {% if problem.problem_image_path %}
        <div style="margin-bottom: 15px;">
            <img src="/{{ problem.problem_image_path }}" alt="問題画像" style="max-width: 100%; border-radius: 4px;" alt="問題画像" style="max-width: 100%; border-radius: 4px;">
        </div>
    {% endif %}
    
    {% if problem.problem_text %}
        <div class="problem-box" style="background-color: #f9f9f9; padding: 15px; border-left: 4px solid #ccc;">
            {{ problem.problem_text }}
        </div>
    {% endif %}
</div>
