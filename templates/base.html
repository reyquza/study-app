<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Learn {% block title %}{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ]
        });
    });
    </script>
</head>

<body>
    <nav>
        <div class="nav-left">
            <a href="/">
                <img src="/static/NextLearn_applogo_80px.png" alt="NextLearn ロゴ" class="nav-logo">
            </a>
        </div>
        
        <div class="nav-center">
            <h2>
                <a href="/" style="color: inherit; text-decoration: none;">Next Learn</a>
            </h2>
        </div>
        
        <div class="nav-right">
            {% if request.state.user %}
            <span class="user-email">👤 {{ request.state.user.email }}</span>
            <br>
            <a href="/logout" class="logout-link" style="color: inherit; text-decoration: none;">ログアウト</a>
            {% endif %}
        </div>
    </nav>
    

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        &copy; 2026 Next Learn. All rights reserved.
        <br>
        Ray
    </footer>
</body>
</html>
